# ld65 config for COMPAT3.PCE: 256 KiB HuCard (32 x 8 KiB banks).
# Every bank is logically mapped at $E000 when selected (bank 0 is
# what the reset vector sees, with MPR7 = 0). ld65 emits MEMORY
# areas to the output file in declaration order, so BANKnn lands at
# file offset nn * $2000. All banks are $FF-filled; only banks with
# segments carry content.
MEMORY {
    BANK00: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK01: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK02: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK03: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK04: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK05: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK06: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK07: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK08: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK09: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK10: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK11: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK12: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK13: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK14: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK15: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK16: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK17: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK18: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK19: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK20: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK21: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK22: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK23: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK24: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK25: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK26: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK27: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK28: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK29: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK30: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    BANK31: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    JUMPTAB:   load = BANK00, type = ro, start = $E000;
    CODE:      load = BANK00, type = ro;
    PLAYER:    load = BANK01, type = ro;
    BMCODE:    load = BANK02, type = ro;
    FNCODE:    load = BANK02, type = ro;
    EXCODE:    load = BANK02, type = ro;
    GRPCODE:   load = BANK03, type = ro;
    # Item-4 bank-switch relay (see exbios.s / grpbios.s):
    # EXRELAY (bank 2, $DFF0) holds lda #$03 / tam #$40; the
    # instruction fetch right after the TAM comes from bank 3
    # at $DFF4, where GRPRELAY holds jmp grp_entry. Fixed
    # addresses: if EXCODE or GRPCODE ever grows into these
    # slots the linker fails loudly on the overlap.
    # font8 glyph data (760 B) moved out of bank 0 in the
    # layer-3 round (2026-11-23): bank 0 was byte-full.
    # Read once at boot by video_init via MPR6 (see video.s).
    # Declared before EXRELAY so ld65 allocates it first.
    # C-D1 round (2026-11-25): the flowing segments grew
    # (the ZP $30-$3B scratch block's move to WRAM made its
    # accesses absolute-encoded), EXCODE now ends at $D775;
    # FONT8B2/VIDEO2/FIXUP2 shifted up accordingly. Layout
    # then: FONT8B2 $D780-$DA77, VIDEO2 $DA78-$DC8C,
    # FIXUP2 $DC90-$DF79, EXRELAY $DFF0.
    # C-D4 round (2026-11-25): BMCODE grew again (the BM
    # block's WRAM move, absolute-encoded counters + the
    # borrow save/restore in bmb_enter/bmb_ret); bank 2
    # overflowed by ~83 bytes even packed. FIXUP2 moved to
    # BANK03 (flows after GRPCODE, ends ~$CCCB, far below
    # GRPRELAY $DFF4); its two relays (crd_fixup in
    # cdbios.s, the IRQ1 compose relay in bank0.s) now map
    # bank 3. Current bank-2 layout: flowing ends $D84C,
    # FONT8B2 $D850-$DB47, VIDEO2 $DB48-$DD5C, EXRELAY
    # $DFF0.
    FONT8B2:   load = BANK02, type = ro, start = $D850;
    # video_init body (layer-5): relocated out of byte-full
    # bank 0 to fund the WRAM work-area move. Fixed start
    # right after FONT8B2 ($D850 + 760 B); if the font data
    # ever grows, the overlap fails the link loudly.
    VIDEO2:    load = BANK02, type = ro, start = $DB48;
    # CD_READ exit-shadow fixups + IRQ1 compose body
    # (layer-5 / layer 10 round 3): relocated out of
    # byte-full bank 0; called via MPR6 relays that map
    # bank 3 (the crd_fixup relay in cdbios.s, the compose
    # relay in bank0.s). Flows after GRPCODE in BANK03.
    FIXUP2:    load = BANK03, type = ro;
    EXRELAY:   load = BANK02, type = ro, start = $DFF0;
    GRPRELAY:  load = BANK03, type = ro, start = $DFF4;
    F16B04:    load = BANK04, type = ro;
    F16B05:    load = BANK05, type = ro;
    F16B06:    load = BANK06, type = ro;
    F16B07:    load = BANK07, type = ro;
    F16B08:    load = BANK08, type = ro;
    F16B09:    load = BANK09, type = ro;
    F16B10:    load = BANK10, type = ro;
    F16B11:    load = BANK11, type = ro;
    F16B12:    load = BANK12, type = ro;
    F16B13:    load = BANK13, type = ro;
    F16B14:    load = BANK14, type = ro;
    F16B15:    load = BANK15, type = ro;
    F16B16:    load = BANK16, type = ro;
    F16B17:    load = BANK17, type = ro;
    F16B18:    load = BANK18, type = ro;
    F12B19:    load = BANK19, type = ro;
    F12B20:    load = BANK20, type = ro;
    F12B21:    load = BANK21, type = ro;
    F12B22:    load = BANK22, type = ro;
    F12B23:    load = BANK23, type = ro;
    F12B24:    load = BANK24, type = ro;
    F12B25:    load = BANK25, type = ro;
    F12B26:    load = BANK26, type = ro;
    F12B27:    load = BANK27, type = ro;
    F12B28:    load = BANK28, type = ro;
    F12B29:    load = BANK29, type = ro;
    TOPBYTE:   load = BANK00, type = ro, start = $FFF5;
    VECTORS:   load = BANK00, type = ro, start = $FFF6;
    SIGNATURE: load = BANK31, type = ro, start = $FFB6;
}
